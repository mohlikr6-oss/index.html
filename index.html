<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL | UNIVERSE EMPEROR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --warn: #ff0055; --bg: #000000; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; cursor: crosshair; }
        
        body { background: var(--bg); color: white; overflow: hidden; height: 100vh; }

        /* ⛈️ MATRIX RAIN BACKGROUND */
        #matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5; }

        /* 🔒 SUPREME LOCK SYSTEM */
        #lock-screen {
            position: fixed; inset: 0; background: radial-gradient(circle, #050505, #000); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .scan-line { width: 100%; height: 2px; background: var(--neon); position: absolute; top: 0; animation: scanAnim 3s linear infinite; box-shadow: 0 0 15px var(--neon); }
        @keyframes scanAnim { to { top: 100%; } }

        #pass-input { 
            background: rgba(0,242,255,0.1); border: 2px solid var(--neon); color: var(--neon); 
            padding: 15px; text-align: center; outline: none; width: 300px; font-size: 20px;
            letter-spacing: 5px; margin-top: 20px; box-shadow: 0 0 20px var(--glow);
        }

        /* 🖥️ GOD-MODE DASHBOARD */
        .god-ui {
            display: none; height: 100vh; padding: 10px;
            border: 5px solid var(--neon); box-shadow: 0 0 50px var(--neon);
            animation: borderPulse 2s infinite alternate;
        }
        @keyframes borderPulse { from { border-color: var(--neon); } to { border-color: var(--warn); } }

        /* 📊 POWER MODULES */
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .module { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon); padding: 10px;
            text-align: center; font-size: 10px; position: relative;
        }
        .module h4 { color: var(--gold); margin-bottom: 5px; }

        /* 📟 TERMINAL */
        #term { 
            height: 200px; background: rgba(0,0,0,0.9); border: 1px solid #0f0; 
            margin-top: 20px; padding: 10px; font-family: 'Share Tech Mono';
            color: #0f0; overflow-y: auto; font-size: 12px;
        }

        .btn-supreme {
            background: var(--neon); color: black; border: none; padding: 15px 30px;
            font-weight: 900; margin: 10px; text-transform: uppercase;
            transition: 0.3s; box-shadow: 0 0 20px var(--neon);
        }
        .btn-supreme:hover { background: white; transform: scale(1.1); box-shadow: 0 0 50px white; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="lock-screen">
        <div class="scan-line"></div>
        <h1 style="color: var(--neon); letter-spacing: 10px;">IDENTITY SCAN</h1>
        <p style="color: #555;">ENTER GOD-MODE KEY</p>
        <input type="password" id="pass-input" placeholder="********">
        <p style="margin-top: 20px; font-size: 10px; color: var(--warn);">WARNING: UNAUTHORIZED ACCESS WILL BE TERMINATED</p>
    </div>

    <div class="god-ui" id="main">
        <div style="display:flex; justify-content:space-between; color:var(--neon); font-size:12px;">
            <span>LOCATION: EARTH_SECTOR_01</span>
            <span>POWER: INFINITY%</span>
            <span id="clock">00:00:00</span>
        </div>

        <h1 style="text-align:center; font-size:4rem; margin-top:20px; text-shadow: 0 0 30px var(--neon);">RAHUL-OS</h1>

        <div class="module-grid">
            <div class="module"><h4>SATELLITE</h4><p>CONNECTED</p></div>
            <div class="module"><h4>WEALTH</h4><p>$999,999,999T</p></div>
            <div class="module"><h4>WEAPONS</h4><p>LASER_READY</p></div>
        </div>

        <div id="term">> BOOTING SUPREME COMMAND...<br>> LOADING RAHUL'S WORLD...</div>

        <div style="text-align:center; margin-top:30px;">
            <button class="btn-supreme" onclick="cmd('HACKING NASA...')">HACK NASA</button>
            <button class="btn-supreme" onclick="cmd('GENERATING 1 BILLION DOLLARS...')">ADD CASH</button>
            <button class="btn-supreme" onclick="cmd('UPGRADING DUNIYA TO V2.0...')">UPGRADE WORLD</button>
            <button class="btn-supreme" onclick="location.reload()">LOGOUT</button>
        </div>
    </div>

    <script>
        // 1. PASSWORD LOGIC
        const input = document.getElementById('pass-input');
        input.addEventListener('keyup', (e) => {
            if(e.key === 'Enter') {
                if(input.value.toUpperCase() === 'RAHUL-GOD-MODE') {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main').style.display = 'block';
                    cmd('WELCOME SUPREME LEADER RAHUL. SYSTEM IS YOURS.');
                } else {
                    alert('WRONG KEY! ACCESS DENIED.');
                    input.value = '';
                }
            }
        });

        // 2. TERMINAL LOGIC
        function cmd(m) {
            const t = document.getElementById('term');
            t.innerHTML += `<br>> [${new Date().toLocaleTimeString()}] ${m}`;
            t.scrollTop = t.scrollHeight;
        }

        // 3. MATRIX RAIN EFFECT
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = "RAHUL1000POWER0101";
        const drops = Array(Math.floor(canvas.width/20)).fill(0);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random()*chars.length)];
                ctx.fillText(text, i*20, y);
                if(y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i] += 20;
            });
        }
        setInterval(drawMatrix, 50);
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
